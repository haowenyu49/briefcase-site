{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block body_class %}site-open nav-autohide page-contact{% endblock %} 

{% block content %}
  <section class="standalone-page contact-page">
    <h1 class="contact-heading">Contact</h1>
  </section>

  <section class="star-section" id="starSection">
    <div class="star-pin" id="starPin">
      <canvas id="starCanvas"></canvas>

      <div class="contact-reveal" id="contactReveal">
        <a class="contact-email-line" href="mailto:{{ content.contact_email }}">{{ content.contact_email }}</a>
        <a class="contact-email-line" href="{{ content.contact_linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <p class="contact-tagline">{{ content.contact_note }}</p>
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="{{ url_for('static', filename='js/star-scene.js') }}"></script>
<script src="{{ url_for('static', filename='js/contact-heading-animation.js') }}"></script>
{% endblock %}
